spring.application.name=hrsaas

# --- Base de datos -----------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/hrsaas
spring.datasource.username=hrsaas
spring.datasource.password=hrsaas

# El esquema lo define Flyway; Hibernate solo verifica que coincide.
# 'update' o 'create' aqui convertiria una discrepancia de esquema en una
# migracion silenciosa, que en nomina es un incidente contable con fecha.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Plataforma --------------------------------------------------------------
hrsaas.platform.invitation-ttl-days=7
