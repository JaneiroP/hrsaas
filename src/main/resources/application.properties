spring.application.name=hrsaas

# --- Base de datos -----------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/hrsaas
spring.datasource.username=hrsaas
spring.datasource.password=hrsaas

# El esquema lo define Flyway; Hibernate solo verifica que coincide.
# 'update' o 'create' aqui convertiria una discrepancia de esquema en una
# migracion silenciosa, que en nomina es un incidente contable con fecha.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RFC 9457 (application/problem+json) tambien para errores que ni siquiera
# llegan a un controlador (404 sin ruta, 405 metodo no soportado): sin esto
# esos casos caerian en el {"timestamp":...,"error":"Not Found"} clasico de
# Boot en vez del mismo formato que ya usan GlobalExceptionHandler y los
# demas @RestControllerAdvice del proyecto.
spring.mvc.problemdetails.enabled=true

# AD-07: sufijo fijado explicito, no depender del valor por defecto de Envers
# sin verificar (aunque coincide: se confirmo con EnversSchemaSpikeTest).
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud

# --- Plataforma --------------------------------------------------------------
hrsaas.platform.invitation-ttl-days=7

# Origenes permitidos para llamadas CORS desde el navegador (coma-separado).
# Puerto por defecto de "ng serve" para hrsaas-frontend en desarrollo local;
# ajustar por entorno cuando exista un dominio real de produccion.
hrsaas.cors.allowed-origins=http://localhost:4200

# --- Perfil demo ----------------------------------------------------------------
# Solo se usa con el perfil "demo" (ver com.ohmdevs.hrsaas.demo): contrasena de
# los cuatro usuarios de demostracion. Es publica a proposito, esta documentada
# en DEMO.md, y es el motivo por el que ese perfil no se activa nunca en un
# entorno con datos reales.
hrsaas.demo.password=${HRSAAS_DEMO_PASSWORD:Demo#2026-hrsaas}

# --- Spring Batch --------------------------------------------------------------
# Ningun job debe autoarrancar al levantar el contexto: romperia @SpringBootTest
# de otros modulos y no tiene sentido en produccion todavia. Los tests que lo
# necesiten lo lanzan explicitamente via JobLauncher.
spring.batch.job.enabled=false

# --- Almacenamiento de documentos (people) --------------------------------------
# Bucket con valor por defecto para que S3DocumentStorageGateway no rompa el
# arranque de ningun @SpringBootTest del proyecto por falta de configuracion.
# access-key/secret-key vacios: en ese caso el gateway usa la cadena por
# defecto de credenciales de AWS (rol IAM, variables de entorno estandar),
# pensada para produccion real. Los tests contra LocalStack fijan credenciales
# de prueba y path-style-access explicitamente.
hrsaas.storage.s3.bucket=hrsaas-documents
hrsaas.storage.s3.region=us-east-1
hrsaas.storage.s3.endpoint=
hrsaas.storage.s3.access-key=
hrsaas.storage.s3.secret-key=
hrsaas.storage.s3.path-style-access=false
